name: AgentSentinel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check src tests

      - name: Run Mypy Strict Typecheck
        run: |
          mypy --strict src

      - name: Run Repository Integrity Guard
        run: |
          pytest tests/unit/test_repo_integrity_guard.py -v

  unit-and-adversarial-tests:
    name: Unit & Adversarial Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Test Suite (Non-Docker)
        run: |
          pytest tests/unit tests/adversarial -m "not integration" -q --basetemp=.pytest_tmp

      - name: Self-Audit via CI-Gate
        run: |
          git diff HEAD~1 HEAD > /tmp/head.diff || true
          if [ -s /tmp/head.diff ]; then
            agentsentinel ci-gate --workspace . --diff /tmp/head.diff --json-out /tmp/audit.json
          fi
